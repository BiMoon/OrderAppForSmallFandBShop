<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#ffffff">
<title>Thống Kê Kinh Doanh</title>
<style>
  :root{
    --bg:#f6f7f9; --surface:#fff; --surface-2:#fbfbfc;
    --line:#e6e8ec; --line-strong:#d5d9e0;
    --ink:#16191f; --ink-2:#5b6472; --ink-3:#8c95a4;
    --brand:#0f766e; --brand-soft:#e6f4f1; --brand-2:#0d9488;
    --ok:#16a34a; --ok-soft:#e9f7ee;
    --warn:#b45309; --warn-soft:#fdf3e3;
    --late:#c02626; --late-soft:#fdecec;
    --radius:14px;
    --shadow-1:0 1px 2px rgba(16,24,40,.05),0 1px 3px rgba(16,24,40,.06);
    --shadow-2:0 4px 12px rgba(16,24,40,.08),0 2px 4px rgba(16,24,40,.04);
  }
  *{box-sizing:border-box}
  body{
    margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    font-size:16px;-webkit-font-smoothing:antialiased;
  }
  button,input,select{font-family:inherit}

  /* ---------- header ---------- */
  .topbar{
    position:sticky;top:0;z-index:50;height:72px;
    display:flex;align-items:center;gap:14px;padding:0 22px;
    background:rgba(255,255,255,.9);
    backdrop-filter:saturate(180%) blur(12px);-webkit-backdrop-filter:saturate(180%) blur(12px);
    border-bottom:1px solid var(--line);
  }
  .brand{display:flex;align-items:center;gap:12px}
  .brand-mark{width:40px;height:40px;border-radius:11px;background:var(--brand);color:#fff;display:grid;place-items:center;font-size:19px}
  .brand-title{font-size:15px;font-weight:700;letter-spacing:-.01em;line-height:1.2}
  .brand-sub{font-size:12px;color:var(--ink-3);margin-top:1px}
  .spacer{flex:1}
  .sync{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600;color:var(--ink-2)}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--ink-3)}
  .sync.online .dot{background:var(--ok);box-shadow:0 0 0 3px var(--ok-soft)}
  .sync.offline .dot{background:var(--late);box-shadow:0 0 0 3px var(--late-soft)}
  .btn{
    height:40px;padding:0 14px;display:inline-flex;align-items:center;justify-content:center;gap:7px;
    border:1px solid var(--line-strong);background:var(--surface);border-radius:10px;
    cursor:pointer;font-size:13.5px;font-weight:600;color:var(--ink-2);transition:.15s;white-space:nowrap;
  }
  .btn:hover{background:var(--surface-2);border-color:var(--ink-3)}
  .btn-primary{background:var(--ink);border-color:var(--ink);color:#fff}
  .btn-primary:hover{background:var(--brand);border-color:var(--brand);color:#fff}
  .btn.sm{height:32px;padding:0 11px;font-size:12.5px}

  /* ---------- filter bar ---------- */
  .filterbar{
    display:flex;align-items:center;gap:10px;flex-wrap:wrap;
    padding:14px 22px;background:var(--surface);border-bottom:1px solid var(--line);
  }
  .fl-label{font-size:12px;font-weight:600;color:var(--ink-3);text-transform:uppercase;letter-spacing:.06em}
  .seg{display:inline-flex;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
  .seg button{border:0;background:transparent;cursor:pointer;padding:7px 15px;border-radius:8px;font-size:13.5px;font-weight:600;color:var(--ink-2);transition:.15s}
  .seg button.active{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-1)}
  .ctl{display:none;align-items:center;gap:8px}
  .ctl.show{display:inline-flex}
  input[type=date],input[type=month],select{
    height:38px;padding:0 11px;border:1px solid var(--line-strong);border-radius:9px;
    background:var(--surface);font-size:13.5px;color:var(--ink);
  }
  input:focus,select:focus{outline:0;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
  .search{
    height:38px;padding:0 12px 0 34px;min-width:200px;
    border:1px solid var(--line-strong);border-radius:9px;background:var(--surface);
    font-size:14px;color:var(--ink);
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='%238c95a4' stroke-width='2.2' stroke-linecap='round'><circle cx='11' cy='11' r='7'/><path d='M20 20l-3.6-3.6'/></svg>");
    background-repeat:no-repeat;background-position:11px center;
  }

  /* ---------- layout ---------- */
  .wrap{padding:22px;max-width:1500px;margin:0 auto}
  .caption{font-size:13px;color:var(--ink-3);margin:-4px 0 14px;font-weight:500}

  .banner{
    display:none;align-items:flex-start;gap:10px;
    padding:12px 15px;border-radius:12px;margin-bottom:16px;
    background:var(--warn-soft);border:1px solid #edd9b0;
    font-size:13.5px;line-height:1.5;color:#7a4a08;
  }
  .banner.show{display:flex}
  .banner b{display:block;margin-bottom:2px}

  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-bottom:18px}
  .kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow-1)}
  .kpi-lbl{font-size:11.5px;font-weight:600;color:var(--ink-3);text-transform:uppercase;letter-spacing:.06em}
  .kpi-val{font-size:30px;font-weight:700;letter-spacing:-.025em;line-height:1.1;margin-top:7px;font-variant-numeric:tabular-nums}
  .kpi-val .u{font-size:14px;font-weight:600;color:var(--ink-3);letter-spacing:0;margin-left:4px}
  .kpi-sub{font-size:12.5px;color:var(--ink-2);margin-top:6px;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .kpi.accent{background:var(--brand);border-color:var(--brand)}
  .kpi.accent .kpi-lbl{color:rgba(255,255,255,.72)}
  .kpi.accent .kpi-val{color:#fff}
  .kpi.accent .kpi-val .u{color:rgba(255,255,255,.72)}
  .kpi.accent .kpi-sub{color:rgba(255,255,255,.82)}
  .kpi.bad .kpi-val{color:var(--late)}

  .cols{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:16px;align-items:start}
  @media (max-width:1120px){.cols{grid-template-columns:1fr}}
  .stack{display:flex;flex-direction:column;gap:16px}

  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow-1);overflow:hidden}
  .card-head{display:flex;align-items:center;gap:10px;padding:15px 18px;border-bottom:1px solid var(--line)}
  .card-title{font-size:14.5px;font-weight:700;letter-spacing:-.01em}
  .card-note{font-size:12px;color:var(--ink-3);font-weight:500}
  .card-body{padding:16px 18px}

  /* ---------- table ---------- */
  table{width:100%;border-collapse:collapse}
  thead th{
    font-size:11.5px;font-weight:600;color:var(--ink-3);text-transform:uppercase;letter-spacing:.05em;
    text-align:left;padding:11px 16px;background:var(--surface-2);border-bottom:1px solid var(--line);
    white-space:nowrap;user-select:none;
  }
  thead th[data-s]{cursor:pointer}
  thead th[data-s]:hover{color:var(--ink)}
  thead th .ar{opacity:.3;font-size:10px;margin-left:3px}
  thead th.sorted{color:var(--ink)}
  thead th.sorted .ar{opacity:1;color:var(--brand)}
  th.num,td.num{text-align:right}
  tbody td{padding:11px 16px;border-bottom:1px solid var(--line);font-size:14px;vertical-align:middle}
  tbody tr:last-child td{border-bottom:0}
  tbody tr:hover{background:var(--surface-2)}
  tfoot td{padding:13px 16px;font-size:14px;font-weight:700;background:var(--surface-2);border-top:2px solid var(--line-strong)}
  .rank{width:25px;height:25px;border-radius:8px;display:grid;place-items:center;font-size:11.5px;font-weight:700;background:var(--bg);color:var(--ink-2);font-variant-numeric:tabular-nums}
  tbody tr:nth-child(1) .rank{background:var(--brand);color:#fff}
  tbody tr:nth-child(2) .rank,tbody tr:nth-child(3) .rank{background:var(--brand-soft);color:var(--brand)}
  .item-name{font-weight:600;letter-spacing:-.005em}
  .nowprice{font-size:10.5px;color:var(--warn);font-weight:700;margin-left:6px;
            background:var(--warn-soft);border-radius:5px;padding:1px 5px;white-space:nowrap}
  .num{font-variant-numeric:tabular-nums}
  .rev{font-weight:700}
  .share{display:flex;align-items:center;gap:9px;min-width:130px}
  .bar{flex:1;height:7px;background:var(--bg);border-radius:99px;overflow:hidden}
  .bar i{display:block;height:100%;background:var(--brand-2);border-radius:99px;transition:width .45s cubic-bezier(.2,.8,.3,1)}
  .share span{font-size:12px;color:var(--ink-2);font-variant-numeric:tabular-nums;width:42px;text-align:right;font-weight:600}

  /* ---------- chart ---------- */
  .chart{display:flex;align-items:flex-end;gap:5px;height:178px;padding-top:14px}
  .col{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px;min-width:0;position:relative}
  .col i{display:block;width:100%;max-width:40px;background:var(--brand-2);border-radius:5px 5px 0 0;min-height:3px;transition:.35s}
  .col:hover i{background:var(--ink)}
  .col em{font-size:10px;color:var(--ink-3);font-style:normal;white-space:nowrap;font-variant-numeric:tabular-nums}
  .col b{position:absolute;top:-4px;font-size:10px;font-weight:700;color:var(--ink-2);font-variant-numeric:tabular-nums;white-space:nowrap}

  /* ---------- cancelled ---------- */
  .cx-row{display:flex;align-items:center;gap:11px;padding:10px 0;border-bottom:1px solid var(--line);font-size:13.5px}
  .cx-row:last-child{border-bottom:0}
  .cx-q{flex:none;width:30px;height:30px;border-radius:8px;background:var(--late-soft);color:var(--late);display:grid;place-items:center;font-size:13px;font-weight:700}
  .cx-nm{flex:1;min-width:0;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .cx-rs{font-size:11.5px;color:var(--ink-3);margin-top:1px;font-weight:500}
  .cx-v{flex:none;font-weight:700;color:var(--late);font-variant-numeric:tabular-nums}

  /* ---------- misc ---------- */
  .empty{text-align:center;padding:52px 20px;color:var(--ink-3)}
  .empty-icon{width:62px;height:62px;margin:0 auto 14px;border-radius:18px;background:var(--bg);display:grid;place-items:center;font-size:27px}
  .empty h3{margin:0 0 5px;font-size:15px;font-weight:700;color:var(--ink-2)}
  .empty p{margin:0;font-size:13px}
  .toast{
    position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);
    background:var(--ink);color:#fff;padding:11px 20px;border-radius:10px;
    font-size:14px;font-weight:600;box-shadow:var(--shadow-2);
    opacity:0;pointer-events:none;transition:.25s;z-index:80;
  }
  .toast.show{opacity:1;transform:translate(-50%,0)}
  .toast.err{background:var(--late)}

  @media (max-width:660px){
    .brand-sub{display:none}
    .topbar,.filterbar,.wrap{padding-left:14px;padding-right:14px}
    thead th,tbody td{padding-left:11px;padding-right:11px}
    .col em{display:none}
    .hide-sm{display:none}
  }
  @media print{
    .topbar,.filterbar,.btn{display:none!important}
    body{background:#fff}
    .card,.kpi{box-shadow:none;break-inside:avoid}
  }
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <div class="brand-mark">📊</div>
    <div>
      <div class="brand-title">Thống Kê Kinh Doanh</div>
      <div class="brand-sub">Doanh thu &amp; sản lượng pha chế</div>
    </div>
  </div>
  <div class="spacer"></div>
  <div class="sync" id="sync"><span class="dot"></span><span id="syncTxt">Đang tải…</span></div>
  <button class="btn" id="btnPrint">🖨️ In</button>
  <button class="btn btn-primary" id="btnCsv">⬇ Xuất CSV</button>
</header>

<div class="filterbar">
  <span class="fl-label">Kỳ</span>
  <div class="seg" id="segMode">
    <button data-m="day" class="active">Ngày</button>
    <button data-m="month">Tháng</button>
    <button data-m="year">Năm</button>
    <button data-m="range">Khoảng</button>
    <button data-m="all">Tất cả</button>
  </div>

  <div class="ctl show" id="ctlDay">
    <input type="date" id="inDate">
    <button class="btn sm" data-jump="0">Hôm nay</button>
    <button class="btn sm" data-jump="-1">Hôm qua</button>
  </div>
  <div class="ctl" id="ctlMonth"><input type="month" id="inMonth"></div>
  <div class="ctl" id="ctlYear"><select id="inYear"></select></div>
  <div class="ctl" id="ctlRange">
    <input type="date" id="inFrom"> <span style="color:var(--ink-3);font-size:13px">→</span> <input type="date" id="inTo">
  </div>

  <div class="spacer"></div>
  <input class="search" id="q" type="search" placeholder="Tìm tên món…" autocomplete="off">
</div>

<main class="wrap">
  <div class="caption" id="caption">&nbsp;</div>

  <div class="banner" id="banner"><span>⚠️</span><span id="bannerTxt"></span></div>

  <section class="kpis">
    <div class="kpi accent">
      <div class="kpi-lbl">Doanh thu</div>
      <div class="kpi-val" id="kRev">–</div>
      <div class="kpi-sub" id="kRevSub">&nbsp;</div>
    </div>
    <div class="kpi">
      <div class="kpi-lbl">Sản lượng</div>
      <div class="kpi-val"><span id="kQty">–</span><span class="u">ly</span></div>
      <div class="kpi-sub" id="kQtySub">&nbsp;</div>
    </div>
    <div class="kpi">
      <div class="kpi-lbl">Trung bình mỗi ly</div>
      <div class="kpi-val" id="kAvg">–</div>
      <div class="kpi-sub" id="kAvgSub">&nbsp;</div>
    </div>
    <div class="kpi">
      <div class="kpi-lbl">Món doanh thu cao nhất</div>
      <div class="kpi-val" style="font-size:19px" id="kTop">–</div>
      <div class="kpi-sub" id="kTopSub">&nbsp;</div>
    </div>
    <div class="kpi bad">
      <div class="kpi-lbl">Đã hủy</div>
      <div class="kpi-val" id="kCx">–</div>
      <div class="kpi-sub" id="kCxSub">&nbsp;</div>
    </div>
  </section>

  <div class="cols">
    <section class="card">
      <div class="card-head">
        <span class="card-title">Chi tiết theo món</span>
        <span class="card-note" id="tblNote"></span>
      </div>
      <table>
        <thead>
          <tr>
            <th style="width:48px">#</th>
            <th data-s="name">Tên món <span class="ar">▾</span></th>
            <th data-s="qty" class="num">SL <span class="ar">▾</span></th>
            <th class="num hide-sm">Đơn giá</th>
            <th data-s="rev" class="num sorted">Thành tiền <span class="ar">▾</span></th>
            <th style="width:150px" class="hide-sm">Tỷ trọng DT</th>
          </tr>
        </thead>
        <tbody id="tbody"><tr><td colspan="6" style="color:var(--ink-3);font-size:13px">Đang tải…</td></tr></tbody>
        <tfoot id="tfoot"></tfoot>
      </table>
    </section>

    <div class="stack">
      <section class="card">
        <div class="card-head">
          <span class="card-title" id="chartTitle">Biểu đồ</span>
          <span class="card-note" id="chartNote"></span>
          <div class="spacer"></div>
          <div class="seg" id="segMetric">
            <button data-v="rev" class="active">₫</button>
            <button data-v="qty">Ly</button>
          </div>
        </div>
        <div class="card-body"><div class="chart" id="chart"></div></div>
      </section>

      <section class="card">
        <div class="card-head">
          <span class="card-title">Món bị hủy</span>
          <span class="card-note" id="cxNote"></span>
        </div>
        <div class="card-body" id="cxBody"></div>
      </section>
    </div>
  </div>
</main>

<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyAWgDT99kbQlTzOG76xVImqtu3tRGPfstI",
  authDomain: "quanlyphachequan.firebaseapp.com",
  databaseURL: "https://quanlyphachequan-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "quanlyphachequan",
  storageBucket: "quanlyphachequan.firebasestorage.app",
  messagingSenderId: "522540933651",
  appId: "1:522540933651:web:acbe8224f1db47b2d895e6"
};
const app = initializeApp(firebaseConfig);
const db  = getDatabase(app);

const API_URL = 'https://script.google.com/macros/s/AKfycbxRdkktSsPqkkiYUE9_lJfvqpnzQaKzn7xZ597jPpXaEfJWwWsy1xjgN9pCkRZSOCJl/exec';

const $   = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nf  = new Intl.NumberFormat('vi-VN');
const money = n => nf.format(Math.round(n||0)) + '₫';
function moneyShort(n){
  n = Math.round(n||0);
  if (n >= 1e9) return (n/1e9).toFixed(n%1e9?1:0).replace('.',',')+' tỷ';
  if (n >= 1e6) return (n/1e6).toFixed(n%1e6?1:0).replace('.',',')+' tr';
  if (n >= 1e3) return Math.round(n/1e3)+'k';
  return String(n);
}

/* ---------- đọc cột "Đơn giá" từ sheet Menu ----------
   Header có thể là "Đơn giá" / "Đơn Giá" / "Giá" / "Price"… nên so khớp theo
   dạng đã bỏ dấu, không gán cứng một chuỗi. */
const slug = s => String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'')
                  .replace(/đ/gi,'d').toLowerCase().replace(/[^a-z0-9]/g,'');
const PRICE_SLUGS = new Set(['dongia','gia','price','dongiavnd','dongiaban','giaban','donggia']);
const NAME_SLUGS  = new Set(['tenmon','ten','name','tensanpham','monnuoc','mon']);

function parsePrice(v){
  if (v === null || v === undefined || v === '') return null;
  if (typeof v === 'number') return isFinite(v) ? v : null;
  let s = String(v).trim().replace(/[^\d.,-]/g,'');
  if (!s) return null;
  const dec = Math.max(s.lastIndexOf('.'), s.lastIndexOf(','));
  if (dec > -1){
    const tail = s.length - dec - 1;
    if (tail === 3 || tail === 0) s = s.replace(/[.,]/g,'');
    else s = s.slice(0,dec).replace(/[.,]/g,'') + '.' + s.slice(dec+1);
  }
  const n = Number(s);
  return isFinite(n) ? n : null;
}
function pick(row, slugs){
  for (const k of Object.keys(row||{})) if (slugs.has(slug(k))) return row[k];
  return undefined;
}

/* ---------- state ---------- */
let rows = [];          // lịch sử đã pha
let cancels = [];       // món bị hủy
let priceByStt = new Map(), priceByName = new Map();
let menuLoaded = false;
let mode = 'day', metric = 'rev';
let sortKey = 'rev', sortDir = -1, query = '';

/* ---------- ngày giờ ---------- */
function ymd(d){
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
const addDays = (d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x;};
const dmy = s => s ? s.slice(8,10)+'/'+s.slice(5,7) : '';

/* ---------- chuẩn hóa bản ghi ---------- */
// đơn giá ưu tiên: giá đã chốt lúc bán -> tra theo STT -> tra theo tên -> không có
function resolvePrice(d){
  const stored = parsePrice(d.price);
  if (stored !== null) return { price: stored, live: false };
  if (d.stt != null && priceByStt.has(String(d.stt)))
    return { price: priceByStt.get(String(d.stt)), live: true };
  const key = slug(d.item);
  if (priceByName.has(key)) return { price: priceByName.get(key), live: true };
  return { price: null, live: false };
}
function normalise(d){
  let date = d.completedDate || d.date || null;
  const ts = typeof d.timestamp === 'number' ? d.timestamp : null;
  if (!date && ts) date = ymd(new Date(ts));
  const qty = Number(d.quantity) || 0;
  const { price, live } = resolvePrice(d);
  const stored = parsePrice(d.revenue);
  return {
    item: String(d.item ?? '(không tên)'),
    qty, date, ts,
    price,
    livePrice: live,                                   // giá lấy từ menu hiện tại, không phải giá lúc bán
    revenue: stored !== null ? stored : (price !== null ? price*qty : 0),
    hasPrice: price !== null
  };
}
function normaliseCancel(d){
  let date = d.cancelledDate || null;
  const ts = typeof d.timestamp === 'number' ? d.timestamp : null;
  if (!date && ts) date = ymd(new Date(ts));
  const qty = Number(d.quantity) || 0;
  const { price } = resolvePrice(d);
  const stored = parsePrice(d.lostRevenue);
  return {
    item: String(d.item ?? '(không tên)'),
    qty, date, reason: d.reason || null, table: d.table ?? null,
    lost: stored !== null ? stored : (price !== null ? price*qty : 0)
  };
}

/* ---------- khoảng thời gian ---------- */
function resolveRange(){
  switch(mode){
    case 'day':   { const v = $('inDate').value;  return v ? [v,v] : [null,null]; }
    case 'month': { const v = $('inMonth').value; return v ? [v+'-01', v+'-31'] : [null,null]; }
    case 'year':  { const v = $('inYear').value;  return v ? [v+'-01-01', v+'-12-31'] : [null,null]; }
    case 'range': return [$('inFrom').value||null, $('inTo').value||null];
    default:      return [null,null];
  }
}
function captionFor(from,to){
  if (mode === 'all')   return 'Toàn bộ dữ liệu lịch sử';
  if (mode === 'year')  return 'Năm ' + $('inYear').value;
  if (mode === 'month'){
    const v = $('inMonth').value;
    return v ? ('Tháng ' + v.slice(5,7) + '/' + v.slice(0,4)) : 'Chưa chọn tháng';
  }
  if (mode === 'day'){
    const v = $('inDate').value;
    if (!v) return 'Chưa chọn ngày';
    const d = new Date(v+'T00:00:00');
    return d.toLocaleDateString('vi-VN',{weekday:'long',day:'2-digit',month:'2-digit',year:'numeric'});
  }
  if (!from && !to) return 'Chưa chọn khoảng';
  return 'Từ ' + dmy(from) + '/' + from.slice(0,4) + ' đến ' + dmy(to) + '/' + to.slice(0,4);
}
const inRange = (date,from,to) => {
  if (!date) return !from && !to;
  if (from && date < from) return false;
  if (to   && date > to)   return false;
  return true;
};

/* ---------- gom nhóm cho biểu đồ ---------- */
function granularity(from,to,data){
  if (mode === 'day')   return 'hour';
  if (mode === 'month') return 'day';
  if (mode === 'year')  return 'month';
  let a = from, b = to;
  if (!a || !b){
    const ds = data.map(r=>r.date).filter(Boolean).sort();
    a = a || ds[0]; b = b || ds[ds.length-1];
  }
  if (!a || !b) return 'day';
  const span = (new Date(b) - new Date(a)) / 86400000;
  return span > 62 ? 'month' : 'day';
}
function bucketise(data, gran){
  const m = new Map();
  data.forEach(r => {
    let k = null;
    if (gran === 'hour'){
      if (r.ts == null) return;
      k = String(new Date(r.ts).getHours()).padStart(2,'0');
    } else if (gran === 'month') k = (r.date||'').slice(0,7);
    else k = r.date;
    if (!k) return;
    const cur = m.get(k) || { qty:0, rev:0 };
    cur.qty += r.qty; cur.rev += r.revenue;
    m.set(k, cur);
  });
  return m;
}
const bucketLabel = (k,gran) => gran==='hour' ? k+'h' : gran==='month' ? 'T'+k.slice(5,7) : dmy(k);

/* ---------- render ---------- */
function render(){
  const [from,to] = resolveRange();
  $('caption').textContent = captionFor(from,to);

  const data = rows.filter(r => inRange(r.date, from, to));
  const cx   = cancels.filter(r => inRange(r.date, from, to));

  /* gộp theo món */
  const byItem = new Map();
  data.forEach(r => {
    const cur = byItem.get(r.item) || { qty:0, rev:0, price:r.price, live:r.livePrice, hasPrice:r.hasPrice };
    cur.qty += r.qty; cur.rev += r.revenue;
    if (cur.price == null && r.price != null){ cur.price = r.price; cur.hasPrice = true; cur.live = r.livePrice; }
    byItem.set(r.item, cur);
  });

  const totalQty = data.reduce((s,r)=>s+r.qty,0);
  const totalRev = data.reduce((s,r)=>s+r.revenue,0);
  const days     = new Set(data.map(r=>r.date).filter(Boolean));
  const missing  = [...byItem.entries()].filter(([,v]) => !v.hasPrice);
  const liveCnt  = [...byItem.values()].filter(v => v.live).length;

  /* cảnh báo */
  const warns = [];
  if (!menuLoaded) warns.push('Chưa tải được bảng giá từ Google Sheet — doanh thu chỉ tính từ giá đã lưu khi bán.');
  if (missing.length) warns.push('<b>'+missing.length+' món chưa có đơn giá</b>' +
    missing.slice(0,4).map(([n])=>esc(n)).join(', ') + (missing.length>4?'…':'') +
    ' — các món này được tính 0₫ nên doanh thu đang thấp hơn thực tế.');
  if (liveCnt) warns.push(liveCnt+' món dùng đơn giá hiện tại trong Menu (bán trước khi hệ thống bắt đầu lưu giá).');
  $('banner').className = warns.length ? 'banner show' : 'banner';
  $('bannerTxt').innerHTML = warns.join('<br>');

  /* KPI */
  $('kRev').textContent = money(totalRev);
  $('kRevSub').textContent = data.length
    ? nf.format(data.length)+' lượt bán · '+days.size+' ngày có doanh thu' : 'Chưa có giao dịch';
  $('kQty').textContent = nf.format(totalQty);
  $('kQtySub').textContent = byItem.size ? byItem.size+' loại món' : ' ';
  $('kAvg').textContent = totalQty ? money(totalRev/totalQty) : '–';
  $('kAvgSub').textContent = days.size ? 'TB ngày: '+money(totalRev/days.size) : ' ';

  const top = [...byItem.entries()].sort((a,b)=>b[1].rev-a[1].rev)[0];
  $('kTop').textContent = top ? top[0] : '–';
  $('kTopSub').textContent = top
    ? money(top[1].rev)+' · '+(totalRev ? (top[1].rev/totalRev*100).toFixed(1)+'% doanh thu' : top[1].qty+' ly') : ' ';

  const cxQty = cx.reduce((s,r)=>s+r.qty,0), cxLost = cx.reduce((s,r)=>s+r.lost,0);
  $('kCx').textContent = cx.length ? money(cxLost) : '0₫';
  $('kCxSub').textContent = cx.length
    ? cx.length+' lượt · '+cxQty+' ly'+(totalRev?' · '+(cxLost/(totalRev+cxLost)*100).toFixed(1)+'% giá trị':'')
    : 'Không có món nào bị hủy';

  /* bảng */
  let list = [...byItem.entries()].map(([item,v]) => ({item, ...v}));
  if (query) list = list.filter(r => r.item.toLowerCase().includes(query));
  list.sort((a,b) => sortKey==='name' ? a.item.localeCompare(b.item,'vi')*sortDir*-1
                   : sortKey==='qty'  ? (a.qty-b.qty)*sortDir
                   : (a.rev-b.rev)*sortDir);

  const maxRev = Math.max(1, ...list.map(r=>r.rev));
  $('tblNote').textContent = list.length ? list.length+' món'+(query?' khớp tìm kiếm':'') : '';

  $('tbody').innerHTML = list.length ? list.map((r,i)=>`
    <tr>
      <td><span class="rank">${i+1}</span></td>
      <td class="item-name">${esc(r.item)}${
        !r.hasPrice ? '<span class="nowprice">chưa có giá</span>'
        : r.live    ? '<span class="nowprice" style="color:var(--ink-3);background:var(--bg)">giá hiện tại</span>' : ''
      }</td>
      <td class="num">${nf.format(r.qty)}</td>
      <td class="num hide-sm" style="color:var(--ink-2)">${r.hasPrice ? money(r.price) : '—'}</td>
      <td class="num rev">${money(r.rev)}</td>
      <td class="hide-sm"><div class="share">
        <div class="bar"><i style="width:${(r.rev/maxRev*100).toFixed(1)}%"></i></div>
        <span>${totalRev ? (r.rev/totalRev*100).toFixed(1) : '0.0'}%</span>
      </div></td>
    </tr>`).join('')
    : `<tr><td colspan="6"><div class="empty">
        <div class="empty-icon">${query?'🔍':'📭'}</div>
        <h3>${query?'Không tìm thấy món nào':'Chưa có dữ liệu trong kỳ này'}</h3>
        <p>${query?'Thử từ khóa khác.':'Món được ghi nhận khi quầy bấm “Hoàn thành”.'}</p>
      </div></td></tr>`;

  $('tfoot').innerHTML = list.length
    ? `<tr><td colspan="2">TỔNG CỘNG</td>
       <td class="num">${nf.format(list.reduce((s,r)=>s+r.qty,0))}</td>
       <td class="hide-sm"></td>
       <td class="num">${money(list.reduce((s,r)=>s+r.rev,0))}</td>
       <td class="hide-sm"></td></tr>` : '';

  /* biểu đồ */
  const gran = granularity(from,to,data);
  const bk   = bucketise(data, gran);
  let keys = [...bk.keys()].sort();
  if (keys.length > 31) keys = keys.slice(-31);
  const val = k => metric==='rev' ? bk.get(k).rev : bk.get(k).qty;
  const dMax = Math.max(1, ...keys.map(val));
  $('chartTitle').textContent = gran==='hour' ? 'Theo giờ trong ngày'
                              : gran==='month' ? 'Theo tháng' : 'Theo ngày';
  $('chartNote').textContent = keys.length ? keys.length + (gran==='hour'?' khung giờ':gran==='month'?' tháng':' ngày') : '';
  $('chart').innerHTML = keys.length
    ? keys.map(k=>{
        const v = val(k);
        const lbl = metric==='rev' ? moneyShort(v) : nf.format(v);
        return `<div class="col" title="${bucketLabel(k,gran)}: ${money(bk.get(k).rev)} · ${bk.get(k).qty} ly">
                  <b>${lbl}</b><i style="height:${Math.max(4, v/dMax*128).toFixed(0)}px"></i>
                  <em>${bucketLabel(k,gran)}</em></div>`;
      }).join('')
    : `<div class="empty" style="margin:auto;padding:20px">
         <div class="empty-icon" style="width:50px;height:50px;font-size:22px">📈</div>
         <p>${gran==='hour' ? 'Bản ghi cũ chưa có giờ để vẽ' : 'Chưa có dữ liệu để vẽ'}</p></div>`;

  /* món bị hủy */
  const cxByItem = new Map();
  cx.forEach(r=>{
    const cur = cxByItem.get(r.item) || { qty:0, lost:0, reasons:new Set() };
    cur.qty += r.qty; cur.lost += r.lost;
    if (r.reason) cur.reasons.add(r.reason);
    cxByItem.set(r.item, cur);
  });
  const cxList = [...cxByItem.entries()].sort((a,b)=>b[1].lost-a[1].lost || b[1].qty-a[1].qty);
  $('cxNote').textContent = cx.length ? cxQty+' ly · '+money(cxLost) : '';
  $('cxBody').innerHTML = cxList.length
    ? cxList.map(([n,v])=>`
        <div class="cx-row">
          <div class="cx-q">${v.qty}</div>
          <div class="cx-nm">${esc(n)}<div class="cx-rs">${esc([...v.reasons].join(', ') || 'Không nêu lý do')}</div></div>
          <div class="cx-v">${v.lost ? '−'+money(v.lost) : '—'}</div>
        </div>`).join('')
    : `<div class="empty" style="padding:26px">
         <div class="empty-icon" style="width:50px;height:50px;font-size:22px">✅</div>
         <p>Không có món nào bị hủy trong kỳ này</p></div>`;

  window.__export = { list, totalQty, totalRev, from, to, cxList, cxLost };
}

/* ---------- sự kiện ---------- */
$('segMode').onclick = e => {
  const b = e.target.closest('button[data-m]'); if (!b) return;
  mode = b.dataset.m;
  [...e.currentTarget.children].forEach(x=>x.classList.toggle('active',x===b));
  ['day','month','year','range'].forEach(m =>
    $('ctl'+m[0].toUpperCase()+m.slice(1)).classList.toggle('show', m===mode));
  render();
};
$('segMetric').onclick = e => {
  const b = e.target.closest('button[data-v]'); if (!b) return;
  metric = b.dataset.v;
  [...e.currentTarget.children].forEach(x=>x.classList.toggle('active',x===b));
  render();
};
$('ctlDay').onclick = e => {
  const b = e.target.closest('[data-jump]'); if (!b) return;
  $('inDate').value = ymd(addDays(new Date(), +b.dataset.jump));
  render();
};
['inDate','inMonth','inYear','inFrom','inTo'].forEach(id => $(id).onchange = render);
$('q').oninput = e => { query = e.target.value.trim().toLowerCase(); render(); };

document.querySelectorAll('thead th[data-s]').forEach(th => {
  th.onclick = () => {
    const k = th.dataset.s;
    if (k === sortKey) sortDir *= -1; else { sortKey = k; sortDir = -1; }
    document.querySelectorAll('thead th').forEach(x=>x.classList.remove('sorted'));
    th.classList.add('sorted');
    th.querySelector('.ar').textContent = sortDir === -1 ? '▾' : '▴';
    render();
  };
});

$('btnPrint').onclick = () => window.print();
$('btnCsv').onclick = () => {
  const x = window.__export;
  if (!x || !x.list.length) return toast('Không có dữ liệu để xuất', true);
  const csv = s => '"' + String(s).replace(/"/g,'""') + '"';
  const lines = [
    ['Ky bao cao', csv(captionFor(x.from,x.to))].join(','), '',
    ['Hang','Ten mon','So luong (ly)','Don gia (VND)','Thanh tien (VND)','Ty trong DT (%)'].join(','),
    ...x.list.map((r,i)=>[i+1, csv(r.item), r.qty, r.hasPrice?Math.round(r.price):'',
                          Math.round(r.rev), x.totalRev?(r.rev/x.totalRev*100).toFixed(1):'0.0'].join(',')),
    '', ['','TONG CONG', x.totalQty, '', Math.round(x.totalRev), '100.0'].join(',')
  ];
  if (x.cxList.length){
    lines.push('', 'MON BI HUY', ['Ten mon','So luong','Gia tri mat (VND)'].join(','),
      ...x.cxList.map(([n,v])=>[csv(n), v.qty, Math.round(v.lost)].join(',')),
      ['TONG', x.cxList.reduce((s,[,v])=>s+v.qty,0), Math.round(x.cxLost)].join(','));
  }
  const blob = new Blob(['﻿' + lines.join('\r\n')], {type:'text/csv;charset=utf-8;'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'doanhthu-' + (x.from||'tatca') + (x.to&&x.to!==x.from?'_'+x.to:'') + '.csv';
  a.click(); URL.revokeObjectURL(a.href);
  toast('Đã xuất báo cáo CSV');
};

function toast(msg, err){
  const t = $('toast');
  t.textContent = msg;
  t.className = 'toast show' + (err ? ' err' : '');
  clearTimeout(t._h); t._h = setTimeout(()=>t.className='toast', 2600);
}

/* ---------- năm có trong dữ liệu ---------- */
function refreshYears(){
  const sel = $('inYear'), cur = sel.value;
  const ys = new Set([String(new Date().getFullYear())]);
  rows.forEach(r => r.date && ys.add(r.date.slice(0,4)));
  cancels.forEach(r => r.date && ys.add(r.date.slice(0,4)));
  const list = [...ys].sort().reverse();
  sel.innerHTML = list.map(y=>`<option value="${y}">${y}</option>`).join('');
  sel.value = list.includes(cur) ? cur : list[0];
}

/* ---------- khởi tạo ---------- */
const today = new Date();
$('inDate').value  = ymd(today);
$('inMonth').value = ymd(today).slice(0,7);
$('inFrom').value  = ymd(addDays(today,-6));
$('inTo').value    = ymd(today);
refreshYears();

/* bảng giá từ Google Sheet (chỉ dùng cho bản ghi cũ chưa lưu giá) */
fetch(API_URL).then(r=>r.json()).then(j=>{
  (Array.isArray(j)?j:[]).forEach(row=>{
    const p = parsePrice(pick(row, PRICE_SLUGS));
    if (p === null) return;
    if (row['STT'] != null) priceByStt.set(String(row['STT']), p);
    const nm = pick(row, NAME_SLUGS);
    if (nm) priceByName.set(slug(nm), p);
  });
  menuLoaded = priceByStt.size > 0 || priceByName.size > 0;
  rebuild();
}).catch(()=>{ menuLoaded = false; rebuild(); });

let rawHistory = [], rawCancel = [];
function rebuild(){
  rows    = rawHistory.map(normalise);
  cancels = rawCancel.map(normaliseCancel);
  refreshYears();
  render();
}

onValue(ref(db,'.info/connected'), s => {
  const on = s.val() === true;
  $('sync').className = 'sync ' + (on ? 'online' : 'offline');
  if (!on) $('syncTxt').textContent = 'Mất kết nối';
});

onValue(ref(db,'history'), snap => {
  // LƯU Ý: snap.forEach của Firebase DỪNG khi callback trả về giá trị truthy.
  // Array.push() trả về độ dài mảng (>=1 = truthy) nên phải bọc trong { } để
  // trả về undefined — nếu không sẽ chỉ đọc được ĐÚNG MỘT bản ghi đầu tiên.
  rawHistory = [];
  snap.forEach(c => { rawHistory.push(c.val() || {}); });
  const n = new Date();
  $('syncTxt').textContent = 'Cập nhật ' + String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0');
  $('sync').classList.add('online');
  rebuild();
}, err => {
  console.error(err);
  $('sync').className = 'sync offline'; $('syncTxt').textContent = 'Lỗi tải dữ liệu';
  toast('Không tải được lịch sử — kiểm tra quyền đọc (.read)', true);
});

onValue(ref(db,'cancelled'), snap => {
  rawCancel = [];
  snap.forEach(c => { rawCancel.push(c.val() || {}); });   // { } bắt buộc, xem ghi chú ở trên
  rebuild();
}, () => { rawCancel = []; rebuild(); });   // nhánh 'cancelled' có thể chưa tồn tại

render();
</script>

<script type="module" src="./auth-guard.js"></script>
