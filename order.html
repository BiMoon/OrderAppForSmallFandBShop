<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Đặt Món</title>
<style>
  :root{
    --bg:#f6f7f9; --surface:#fff; --surface-2:#fbfbfc;
    --line:#e6e8ec; --line-strong:#d5d9e0;
    --ink:#16191f; --ink-2:#5b6472; --ink-3:#8c95a4;
    --brand:#0f766e; --brand-soft:#e6f4f1; --brand-2:#0d9488;
    --ok:#16a34a; --ok-soft:#e9f7ee;
    --warn:#b45309; --warn-soft:#fdf3e3;
    --late:#c02626; --late-soft:#fdecec;
    --radius:14px;
    --shadow-1:0 1px 2px rgba(16,24,40,.05),0 1px 3px rgba(16,24,40,.06);
    --shadow-2:0 4px 12px rgba(16,24,40,.08),0 2px 4px rgba(16,24,40,.04);
    --shadow-3:0 20px 48px rgba(16,24,40,.18);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    font-size:16px;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;
    display:flex;flex-direction:column;overflow:hidden;
  }
  button,input{font-family:inherit}
  ::-webkit-scrollbar{width:8px;height:8px}
  ::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:99px}
  ::-webkit-scrollbar-track{background:transparent}

  /* ══════════ HEADER ══════════ */
  .topbar{
    flex:none;height:64px;display:flex;align-items:center;gap:14px;padding:0 20px;
    background:var(--surface);border-bottom:1px solid var(--line);
  }
  .brand{display:flex;align-items:center;gap:11px}
  .brand-mark{width:38px;height:38px;border-radius:11px;background:var(--brand);color:#fff;display:grid;place-items:center;font-size:18px}
  .brand-title{font-size:15px;font-weight:700;letter-spacing:-.01em;line-height:1.2}
  .brand-sub{font-size:11.5px;color:var(--ink-3);margin-top:1px}
  .spacer{flex:1}
  .conn{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600;color:var(--ink-2)}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--ink-3)}
  .conn.online .dot{background:var(--ok);box-shadow:0 0 0 3px var(--ok-soft)}
  .conn.offline .dot{background:var(--late);box-shadow:0 0 0 3px var(--late-soft)}
  .pill{
    display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px;
    border-radius:99px;background:var(--bg);border:1px solid var(--line);
    font-size:12.5px;font-weight:600;color:var(--ink-2);
  }
  .pill b{color:var(--ink);font-variant-numeric:tabular-nums}

  /* ══════════ TABLE STRIP ══════════ */
  .tablebar{
    flex:none;display:flex;align-items:center;gap:10px;padding:4px 14px 4px 20px;
    background:var(--surface);border-bottom:1px solid var(--line);
    overflow:visible;                    /* thanh cuộn nằm ở .tables, không phải ở đây */
  }
  .tb-label{font-size:11.5px;font-weight:600;color:var(--ink-3);text-transform:uppercase;letter-spacing:.06em;white-space:nowrap;flex:none}

  .tables-wrap{position:relative;flex:1;min-width:0;display:flex;align-items:center}

  .tables{
    flex:1;min-width:0;
    display:flex;gap:8px;
    overflow-x:auto;overflow-y:hidden;
    /* padding chừa chỗ cho badge (-6px), vòng đỏ has-cancel (3px) và thanh cuộn */
    padding:10px 10px 4px;
    scroll-behavior:smooth;
    overscroll-behavior-x:contain;
    scrollbar-width:thin;
    scrollbar-color:var(--ink-3) var(--bg);
  }
  /* thanh cuộn ngang rõ ràng, đủ dày để kéo bằng chuột */
  .tables::-webkit-scrollbar{height:10px}
  .tables::-webkit-scrollbar-track{background:var(--bg);border-radius:99px;margin:0 4px}
  .tables::-webkit-scrollbar-thumb{
    background:var(--ink-3);border-radius:99px;
    border:2px solid var(--surface);min-width:40px;
  }
  .tables::-webkit-scrollbar-thumb:hover{background:var(--ink-2)}

  /* nút mũi tên — chỉ hiện khi thực sự tràn */
  .tnav{
    position:absolute;top:50%;transform:translateY(-50%);z-index:5;
    width:30px;height:38px;border:1px solid var(--line-strong);background:var(--surface);
    border-radius:9px;cursor:pointer;font-size:17px;line-height:1;color:var(--ink-2);
    box-shadow:var(--shadow-2);transition:.15s;display:none;place-items:center;
  }
  .tables-wrap.scrollable .tnav{display:grid}
  .tnav:hover:not(:disabled){background:var(--ink);border-color:var(--ink);color:#fff}
  .tnav:disabled{opacity:0;pointer-events:none}
  .tnav.prev{left:-2px}
  .tnav.next{right:-2px}
  /* làm mờ hai mép để thấy rõ là còn nội dung bên ngoài */
  .tables-wrap.scrollable::before,
  .tables-wrap.scrollable::after{
    content:"";position:absolute;top:0;bottom:0;width:38px;pointer-events:none;z-index:4;
    opacity:0;transition:opacity .18s;
  }
  .tables-wrap.scrollable::before{left:0;background:linear-gradient(90deg,var(--surface) 30%,transparent)}
  .tables-wrap.scrollable::after{right:0;background:linear-gradient(270deg,var(--surface) 30%,transparent)}
  .tables-wrap.can-prev::before{opacity:1}
  .tables-wrap.can-next::after{opacity:1}

  .tbl{
    position:relative;min-width:60px;height:48px;padding:0 10px;
    border:1.5px solid var(--line-strong);background:var(--surface);border-radius:11px;
    cursor:pointer;transition:.15s;flex:0 0 auto;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
  }
  .tbl:hover{border-color:var(--ink-3);background:var(--surface-2)}
  .tbl b{font-size:17px;font-weight:700;letter-spacing:-.02em;color:var(--ink);line-height:1}
  .tbl s{font-size:9.5px;text-decoration:none;color:var(--ink-3);letter-spacing:.05em;text-transform:uppercase}
  .tbl.active{background:var(--ink);border-color:var(--ink)}
  .tbl.active b,.tbl.active s{color:#fff}
  .tbl.active s{color:rgba(255,255,255,.65)}
  .tbl .badge{
    position:absolute;top:-6px;right:-6px;min-width:19px;height:19px;padding:0 5px;
    border-radius:99px;font-size:10.5px;font-weight:700;line-height:19px;text-align:center;
    color:#fff;box-shadow:0 0 0 2px var(--surface);font-variant-numeric:tabular-nums;
  }
  .tbl .badge[hidden]{display:none}
  .tbl .badge.wait{background:var(--warn)}
  .tbl .badge.cart{background:var(--brand);right:auto;left:-6px}
  .tbl.has-cancel{border-color:var(--late);box-shadow:0 0 0 3px var(--late-soft)}

  /* ══════════ LAYOUT ══════════ */
  .stage{flex:1;display:grid;grid-template-columns:312px minmax(0,1fr) 372px;gap:0;overflow:hidden}
  .pane{display:flex;flex-direction:column;overflow:hidden;min-width:0;background:var(--bg)}
  .pane + .pane{border-left:1px solid var(--line)}
  .pane-head{
    flex:none;display:flex;align-items:center;gap:9px;padding:13px 16px;
    background:var(--surface);border-bottom:1px solid var(--line);
  }
  .pane-title{font-size:13.5px;font-weight:700;letter-spacing:-.01em}
  .pane-note{font-size:11.5px;color:var(--ink-3);font-weight:600}
  .pane-body{flex:1;overflow-y:auto;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
  .pane-foot{flex:none;padding:12px 16px;background:var(--surface);border-top:1px solid var(--line)}

  /* ══════════ ENTRY PANE ══════════ */
  .seg{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px;width:100%}
  .seg button{flex:1;border:0;background:transparent;cursor:pointer;padding:7px 10px;border-radius:8px;font-size:13px;font-weight:600;color:var(--ink-2);transition:.15s}
  .seg button.active{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-1)}

  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow-1)}

  #display{
    height:62px;display:flex;align-items:center;justify-content:flex-end;
    padding:0 16px;font-size:34px;font-weight:700;letter-spacing:.08em;
    font-variant-numeric:tabular-nums;color:var(--ink);
    background:var(--surface);border:1px solid var(--line);border-radius:12px;
  }
  #display.blank{color:var(--ink-3);font-weight:400}
  #preview{
    min-height:36px;display:flex;align-items:center;justify-content:center;gap:7px;
    padding:7px 12px;border-radius:10px;font-size:13px;font-weight:600;text-align:center;
    border:1px dashed var(--line-strong);color:var(--ink-3);transition:.15s;
  }
  #preview.match{background:var(--brand-soft);border:1px solid var(--brand);color:var(--brand);border-style:solid}
  #preview.nomatch{background:var(--late-soft);border:1px solid var(--late);color:var(--late);border-style:solid}

  .qtybar{display:flex;align-items:center;background:var(--surface);border:1px solid var(--line-strong);border-radius:11px;overflow:hidden}
  .qtybar .lbl{flex:1;padding-left:14px;font-size:12.5px;font-weight:600;color:var(--ink-3);text-transform:uppercase;letter-spacing:.05em}
  .step{width:44px;height:44px;border:0;background:var(--surface-2);color:var(--ink);font-size:20px;font-weight:600;cursor:pointer;transition:.12s}
  .step:hover{background:var(--brand-soft);color:var(--brand)}
  .step:active{transform:scale(.94)}
  #qty{width:52px;text-align:center;font-size:18px;font-weight:700;font-variant-numeric:tabular-nums}

  .numpad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .key{
    height:56px;border:1px solid var(--line);background:var(--surface);border-radius:12px;
    font-size:22px;font-weight:600;color:var(--ink);cursor:pointer;
    box-shadow:var(--shadow-1);transition:.12s;
  }
  .key:hover{background:var(--surface-2);border-color:var(--line-strong)}
  .key:active{transform:scale(.95);background:var(--brand-soft)}
  .key.del{color:var(--late);font-size:19px}
  .key.add{
    grid-column:span 3;height:52px;background:var(--ink);border-color:var(--ink);color:#fff;
    font-size:15px;font-weight:700;letter-spacing:.01em;
  }
  .key.add:hover{background:var(--brand);border-color:var(--brand)}

  .searchbox{position:relative}
  .search{
    width:100%;height:42px;padding:0 12px 0 36px;
    border:1px solid var(--line-strong);border-radius:11px;background:var(--surface);
    font-size:14.5px;color:var(--ink);
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='%238c95a4' stroke-width='2.2' stroke-linecap='round'><circle cx='11' cy='11' r='7'/><path d='M20 20l-3.6-3.6'/></svg>");
    background-repeat:no-repeat;background-position:12px center;
  }
  .search:focus{outline:0;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
  .menu-grid{display:grid;grid-template-columns:1fr;gap:7px}
  .mi{
    display:flex;align-items:center;gap:10px;text-align:left;
    padding:10px 12px;border:1px solid var(--line);background:var(--surface);
    border-radius:11px;cursor:pointer;transition:.12s;box-shadow:var(--shadow-1);
  }
  .mi:hover{border-color:var(--brand);background:var(--brand-soft)}
  .mi:active{transform:scale(.985)}
  .mi .code{
    flex:none;min-width:34px;height:30px;padding:0 7px;border-radius:8px;background:var(--bg);
    display:grid;place-items:center;font-size:12.5px;font-weight:700;color:var(--ink-2);
    font-variant-numeric:tabular-nums;
  }
  .mi:hover .code{background:var(--brand);color:#fff}
  .mi .nm{flex:1;min-width:0;font-size:14px;font-weight:600;line-height:1.3}
  .mi mark{background:#fef08a;color:inherit;border-radius:3px;padding:0 1px}

  /* ══════════ CART PANE ══════════ */
  .tabs{display:flex;gap:6px;flex-wrap:wrap;padding:11px 16px;background:var(--surface);border-bottom:1px solid var(--line);flex:none}
  .tab{
    padding:6px 12px;border-radius:99px;border:1px solid var(--line-strong);background:var(--surface);
    font-size:12.5px;font-weight:600;color:var(--ink-2);cursor:pointer;transition:.15s;
    display:inline-flex;align-items:center;gap:6px;
  }
  .tab:hover{border-color:var(--ink-3)}
  .tab.active{background:var(--ink);border-color:var(--ink);color:#fff}
  .tab .c{font-size:10.5px;padding:1px 6px;border-radius:99px;background:var(--bg);color:var(--ink-2);font-variant-numeric:tabular-nums}
  .tab.active .c{background:rgba(255,255,255,.22);color:#fff}

  .row{
    display:flex;align-items:center;gap:11px;padding:11px 13px;
    background:var(--surface);border:1px solid var(--line);border-radius:12px;
    box-shadow:var(--shadow-1);animation:in .2s ease;flex:none;
  }
  @keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .row .qc{display:flex;align-items:center;gap:2px;flex:none}
  .row .qc button{
    width:28px;height:28px;border:1px solid var(--line);background:var(--surface-2);
    border-radius:8px;font-size:15px;font-weight:600;color:var(--ink-2);cursor:pointer;transition:.12s;
  }
  .row .qc button:hover{background:var(--brand-soft);color:var(--brand);border-color:var(--brand)}
  .row .qv{min-width:34px;text-align:center;font-size:15px;font-weight:700;font-variant-numeric:tabular-nums}
  .row .info{flex:1;min-width:0}
  .row .nm{font-size:14.5px;font-weight:600;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row .mt{font-size:11.5px;color:var(--ink-3);margin-top:2px;font-variant-numeric:tabular-nums}
  .row .acts{display:flex;gap:5px;flex:none}
  .ico{
    width:30px;height:30px;border:1px solid var(--line);background:var(--surface);
    border-radius:8px;cursor:pointer;font-size:13px;color:var(--ink-2);transition:.12s;
  }
  .ico:hover{background:var(--surface-2);border-color:var(--ink-3)}
  .ico.danger:hover{background:var(--late-soft);border-color:var(--late);color:var(--late)}

  .btn{
    height:40px;padding:0 14px;display:inline-flex;align-items:center;justify-content:center;gap:7px;
    border:1px solid var(--line-strong);background:var(--surface);border-radius:10px;
    cursor:pointer;font-size:13.5px;font-weight:600;color:var(--ink-2);transition:.15s;white-space:nowrap;
  }
  .btn:hover{background:var(--surface-2);border-color:var(--ink-3)}
  .btn.sm{height:32px;padding:0 11px;font-size:12.5px}
  .btn.danger{color:var(--late);border-color:#f0c9c9}
  .btn.danger:hover{background:var(--late-soft);border-color:var(--late)}
  .btn-send{
    width:100%;height:52px;border:0;border-radius:12px;cursor:pointer;
    background:var(--ink);color:#fff;font-size:15.5px;font-weight:700;letter-spacing:.01em;
    display:flex;align-items:center;justify-content:center;gap:9px;transition:.15s;
  }
  .btn-send:hover:not(:disabled){background:var(--brand)}
  .btn-send:active:not(:disabled){transform:scale(.99)}
  .btn-send:disabled{background:var(--line);color:var(--ink-3);cursor:default}
  .btn-send .n{background:rgba(255,255,255,.2);border-radius:99px;padding:2px 9px;font-size:13px;font-variant-numeric:tabular-nums}

  /* ══════════ PENDING PANE ══════════ */
  .pend{
    position:relative;padding:12px 13px;background:var(--surface);
    border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow-1);
    display:flex;flex-direction:column;gap:9px;flex:none;animation:in .2s ease;
  }
  .pend::before{content:"";position:absolute;left:0;top:12px;bottom:12px;width:3px;border-radius:0 3px 3px 0;background:var(--line-strong)}
  .pend.age-warn::before{background:var(--warn)}
  .pend.age-late::before{background:var(--late)}
  .pend.req{border-color:var(--warn);background:var(--warn-soft)}
  .pend.rej{border-color:var(--late);background:var(--late-soft)}
  .pend-top{display:flex;align-items:flex-start;gap:9px}
  .pend .q{
    flex:none;width:34px;height:34px;border-radius:9px;background:var(--ink);color:#fff;
    display:grid;place-items:center;font-size:15px;font-weight:700;font-variant-numeric:tabular-nums;
  }
  .pend .nm{flex:1;min-width:0;font-size:14.5px;font-weight:600;line-height:1.3;word-break:break-word}
  .pend .mt{font-size:11.5px;color:var(--ink-3);margin-top:2px;font-variant-numeric:tabular-nums}
  .pend .el{flex:none;font-size:12px;font-weight:700;color:var(--ink-2);font-variant-numeric:tabular-nums}
  .age-warn .el{color:var(--warn)} .age-late .el{color:var(--late)}
  .note{
    font-size:12.5px;line-height:1.45;padding:8px 10px;border-radius:9px;
    background:var(--surface);border:1px solid var(--line);
  }
  .note b{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.05em;margin-bottom:3px}
  .note.w b{color:var(--warn)} .note.r b{color:var(--late)}
  .pend-acts{display:flex;gap:6px}
  .pend-acts .btn{flex:1;height:34px;font-size:12.5px}

  /* ══════════ EMPTY / TOAST / MODAL ══════════ */
  .empty{margin:auto;text-align:center;padding:34px 16px;color:var(--ink-3)}
  .empty .ic{width:58px;height:58px;margin:0 auto 13px;border-radius:17px;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;font-size:25px}
  .empty h4{font-size:14px;font-weight:700;color:var(--ink-2);margin-bottom:4px}
  .empty p{font-size:12.5px;line-height:1.5}

  .toast{
    position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);
    background:var(--ink);color:#fff;padding:12px 22px;border-radius:11px;
    font-size:14px;font-weight:600;box-shadow:var(--shadow-3);
    opacity:0;pointer-events:none;transition:.25s;z-index:600;
  }
  .toast.show{opacity:1;transform:translate(-50%,0)}
  .toast.err{background:var(--late)}
  .toast.ok{background:var(--ok)}

  .overlay{
    position:fixed;inset:0;background:rgba(16,24,40,.45);z-index:500;
    display:none;align-items:center;justify-content:center;padding:20px;
    backdrop-filter:blur(2px);
  }
  .overlay.open{display:flex}
  .modal{
    background:var(--surface);border-radius:18px;box-shadow:var(--shadow-3);
    width:100%;max-width:420px;max-height:88vh;overflow:auto;
  }
  .modal-head{padding:18px 20px 0}
  .modal-head h3{font-size:17px;font-weight:700;letter-spacing:-.01em}
  .modal-head p{font-size:13px;color:var(--ink-2);margin-top:5px;line-height:1.5}
  .modal-body{padding:16px 20px}
  .modal-foot{padding:0 20px 18px;display:flex;gap:9px}
  .modal-foot .btn{flex:1;height:44px;font-size:14px}
  .modal-foot .btn.solid{background:var(--ink);border-color:var(--ink);color:#fff}
  .modal-foot .btn.solid:hover{background:var(--brand);border-color:var(--brand)}
  .modal-foot .btn.solid.danger{background:var(--late);border-color:var(--late);color:#fff}
  .modal-foot .btn.solid.danger:hover{background:#a51f1f;border-color:#a51f1f}
  .tblgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
  .tblgrid button{
    height:46px;border:1px solid var(--line-strong);background:var(--surface);border-radius:10px;
    font-size:16px;font-weight:700;color:var(--ink);cursor:pointer;transition:.12s;
  }
  .tblgrid button:hover{background:var(--brand);border-color:var(--brand);color:#fff}
  .tblgrid button.cur{background:var(--brand-soft);border-color:var(--brand);color:var(--brand)}
  .reasons{display:flex;flex-direction:column;gap:7px;margin-bottom:12px}
  .reason{
    display:flex;align-items:center;gap:10px;padding:11px 13px;
    border:1px solid var(--line-strong);border-radius:11px;background:var(--surface);
    cursor:pointer;font-size:14px;font-weight:600;color:var(--ink-2);transition:.12s;text-align:left;
  }
  .reason:hover{border-color:var(--ink-3)}
  .reason.sel{border-color:var(--late);background:var(--late-soft);color:var(--late)}
  .reason .rk{width:18px;height:18px;border-radius:50%;border:2px solid var(--line-strong);flex:none}
  .reason.sel .rk{border-color:var(--late);background:var(--late);box-shadow:inset 0 0 0 3px #fff}
  .modal textarea{
    width:100%;min-height:66px;padding:11px 13px;border:1px solid var(--line-strong);
    border-radius:11px;font-size:14px;color:var(--ink);resize:vertical;font-family:inherit;
  }
  .modal textarea:focus{outline:0;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
  .recap{display:flex;align-items:center;gap:11px;padding:12px 14px;background:var(--bg);border-radius:12px;margin-bottom:14px}
  .recap .q{width:36px;height:36px;border-radius:9px;background:var(--ink);color:#fff;display:grid;place-items:center;font-size:15px;font-weight:700}
  .recap .nm{font-size:15px;font-weight:700;line-height:1.25}
  .recap .mt{font-size:12px;color:var(--ink-3);margin-top:2px}

  /* ══════════ RESPONSIVE ══════════ */
  @media (max-width:1280px){ .stage{grid-template-columns:280px minmax(0,1fr) 330px} }
  @media (max-width:1080px){
    body{overflow:auto;height:auto}
    .stage{grid-template-columns:1fr;overflow:visible}
    .pane{max-height:none;border-left:0;border-top:1px solid var(--line)}
    .pane-body{overflow:visible}
  }
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <div class="brand-mark">🍵</div>
    <div>
      <div class="brand-title">Đặt Món</div>
      <div class="brand-sub">Point of Sale</div>
    </div>
  </div>
  <div class="spacer"></div>
  <span class="pill" id="pillMenu">Thực đơn <b>—</b></span>
  <span class="pill" id="pillPend">Đang chờ pha <b>0</b></span>
  <div class="conn" id="conn"><span class="dot"></span><span id="connTxt">Đang kết nối…</span></div>
</header>

<div class="tablebar">
  <span class="tb-label">Bàn</span>
  <div class="tables-wrap" id="tablesWrap">
    <button class="tnav prev" id="tPrev" aria-label="Cuộn sang trái">‹</button>
    <div class="tables" id="tables"></div>
    <button class="tnav next" id="tNext" aria-label="Cuộn sang phải">›</button>
  </div>
</div>

<div class="stage">

  <!-- ── PANE 1 · ENTRY ── -->
  <section class="pane">
    <div class="pane-head"><span class="pane-title">Chọn món</span></div>
    <div class="pane-body" style="gap:11px">
      <div class="seg" id="segMode">
        <button data-m="pad" class="active">⌨ Bàn phím số</button>
        <button data-m="menu">📋 Thực đơn</button>
      </div>

      <!-- numpad mode -->
      <div id="modePad" style="display:flex;flex-direction:column;gap:11px">
        <div id="display" class="blank">—</div>
        <div id="preview">Nhập mã món…</div>
        <div class="qtybar">
          <span class="lbl">Số lượng</span>
          <button class="step" id="qMinus">−</button>
          <span id="qty">1</span>
          <button class="step" id="qPlus">+</button>
        </div>
        <div class="numpad" id="numpad">
          <button class="key" data-k="7">7</button>
          <button class="key" data-k="8">8</button>
          <button class="key" data-k="9">9</button>
          <button class="key" data-k="4">4</button>
          <button class="key" data-k="5">5</button>
          <button class="key" data-k="6">6</button>
          <button class="key" data-k="1">1</button>
          <button class="key" data-k="2">2</button>
          <button class="key" data-k="3">3</button>
          <button class="key del" data-k="del">⌫</button>
          <button class="key" data-k="0">0</button>
          <button class="key del" data-k="clr" style="font-size:14px">C</button>
          <button class="key add" data-k="add">✚ Thêm vào giỏ</button>
        </div>
      </div>

      <!-- menu mode -->
      <div id="modeMenu" style="display:none;flex-direction:column;gap:11px">
        <div class="qtybar">
          <span class="lbl">Số lượng</span>
          <button class="step" id="qMinus2">−</button>
          <span id="qty2">1</span>
          <button class="step" id="qPlus2">+</button>
        </div>
        <div class="searchbox"><input class="search" id="q" type="search" placeholder="Tìm tên món hoặc mã…" autocomplete="off"></div>
        <div class="menu-grid" id="menuGrid"></div>
      </div>
    </div>
  </section>

  <!-- ── PANE 2 · CART ── -->
  <section class="pane">
    <div class="pane-head">
      <span class="pane-title">Giỏ hàng</span>
      <span class="pane-note" id="cartNote">chưa gửi</span>
      <div class="spacer"></div>
      <button class="btn sm danger" id="btnClear">🗑 Xóa tất cả</button>
    </div>
    <div class="tabs" id="cartTabs"></div>
    <div class="pane-body" id="cartBody"></div>
    <div class="pane-foot">
      <button class="btn-send" id="btnSend" disabled>📤 Gửi đơn xuống quầy</button>
    </div>
  </section>

  <!-- ── PANE 3 · PENDING AT BAR ── -->
  <section class="pane">
    <div class="pane-head">
      <span class="pane-title">Chưa pha xong</span>
      <span class="pane-note" id="pendNote"></span>
      <div class="spacer"></div>
      <button class="btn sm" id="btnScope">Bàn 1</button>
    </div>
    <div class="pane-body" id="pendBody"></div>
  </section>

</div>

<!-- Modal: change table -->
<div class="overlay" id="ovTable">
  <div class="modal">
    <div class="modal-head"><h3>Chuyển sang bàn khác</h3><p id="tblRecap"></p></div>
    <div class="modal-body"><div class="tblgrid" id="tblGrid"></div></div>
    <div class="modal-foot"><button class="btn" data-close="ovTable">Hủy bỏ</button></div>
  </div>
</div>

<!-- Modal: cancel request -->
<div class="overlay" id="ovCancel">
  <div class="modal">
    <div class="modal-head">
      <h3>Yêu cầu hủy món</h3>
      <p>Món này đã gửi xuống quầy. Quầy pha chế sẽ nhận yêu cầu và xác nhận trước khi món bị hủy.</p>
    </div>
    <div class="modal-body">
      <div class="recap" id="cancelRecap"></div>
      <div class="reasons" id="reasons"></div>
      <textarea id="cancelNote" placeholder="Ghi chú thêm cho quầy (không bắt buộc)…"></textarea>
    </div>
    <div class="modal-foot">
      <button class="btn" data-close="ovCancel">Quay lại</button>
      <button class="btn solid danger" id="btnSendCancel">Gửi yêu cầu hủy</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getDatabase, ref, push, onValue, update, serverTimestamp }
  from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyAWgDT99kbQlTzOG76xVImqtu3tRGPfstI",
  authDomain: "quanlyphachequan.firebaseapp.com",
  databaseURL: "https://quanlyphachequan-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "quanlyphachequan",
  storageBucket: "quanlyphachequan.firebasestorage.app",
  messagingSenderId: "522540933651",
  appId: "1:522540933651:web:acbe8224f1db47b2d895e6"
};
const app = initializeApp(firebaseConfig);
const db  = getDatabase(app);
const ordersRef = ref(db,'orders');

const API_URL = 'https://script.google.com/macros/s/AKfycbxRdkktSsPqkkiYUE9_lJfvqpnzQaKzn7xZ597jPpXaEfJWwWsy1xjgN9pCkRZSOCJl/exec';
const TABLES = 10;
const CANCEL_REASONS = ['Khách đổi ý','Đặt nhầm món','Nhầm bàn','Hết nguyên liệu','Lý do khác'];

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rxEsc = s => s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');

/* ---------- state ---------- */
let menu = [];
let input = '';
let qty = 1;
let table = 1;              // bàn đang chọn
let cartTab = 'all';
let cart = [];              // [{id, stt, name, qty, table, time}]
let nextId = 1;
let mode = 'pad';
let pending = [];           // [{key, item, quantity, table, time, at, cancel}]
let scopeAll = false;       // false = chỉ bàn đang chọn
let cancelKey = null, cancelReason = CANCEL_REASONS[0];

/* ---------- utils ---------- */
function parseClock(str){
  const m = /^(\d{1,2}):(\d{2})/.exec(String(str||''));
  if (!m) return Date.now();
  const d = new Date(); d.setHours(+m[1],+m[2],0,0);
  if (d.getTime() - Date.now() > 2*3600e3) d.setDate(d.getDate()-1);
  return d.getTime();
}
function fmtEl(ms){
  const s = Math.max(0,Math.floor(ms/1000)), m = Math.floor(s/60);
  return m < 60 ? m+"′"+String(s%60).padStart(2,'0')+"″" : Math.floor(m/60)+"h"+String(m%60).padStart(2,'0');
}
const ageCls = ms => ms/60000 >= 10 ? 'age-late' : ms/60000 >= 5 ? 'age-warn' : '';
function nowHM(){
  const n = new Date();
  return String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0');
}
function toast(msg,kind){
  const t = $('toast');
  t.textContent = msg;
  t.className = 'toast show' + (kind ? ' '+kind : '');
  clearTimeout(t._h); t._h = setTimeout(()=>t.className='toast',2600);
}
document.querySelectorAll('[data-close]').forEach(b => b.onclick = () => $(b.dataset.close).classList.remove('open'));
document.querySelectorAll('.overlay').forEach(o => o.onclick = e => { if (e.target === o) o.classList.remove('open'); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') document.querySelectorAll('.overlay.open').forEach(o=>o.classList.remove('open')); });

/* ---------- table strip ---------- */
/* Các nút bàn chỉ được DỰNG MỘT LẦN. Trước đây renderTables() gán lại innerHTML
   mỗi khi Firebase báo thay đổi, khiến scrollLeft bị reset về 0 — người dùng cuộn
   tới bàn 9 là bị kéo ngược về đầu ngay lập tức, trông như "không cuộn được". */
const scroller = $('tables'), wrap = $('tablesWrap');
let tblEls = [];

function buildTables(){
  scroller.innerHTML = Array.from({length:TABLES},(_,i)=>{
    const n = i+1;
    return `<button class="tbl" data-t="${n}">
      <span class="badge cart" hidden></span>
      <span class="badge wait" hidden></span>
      <b>${n}</b><s>bàn</s>
    </button>`;
  }).join('');
  tblEls = [...scroller.children];
  updateNav();
}

function renderTables(){
  tblEls.forEach((el,i) => {
    const n = i+1;
    const c  = cart.filter(o=>o.table===n).reduce((s,o)=>s+o.qty,0);
    const p  = pending.filter(o=>o.table==n);
    const pq = p.reduce((s,o)=>s+(Number(o.quantity)||0),0);
    el.classList.toggle('active', n===table);
    el.classList.toggle('has-cancel', p.some(o=>o.cancel && o.cancel.state==='requested'));
    const bc = el.children[0], bw = el.children[1];
    bc.hidden = !c;  bc.textContent = c  || '';
    bw.hidden = !pq; bw.textContent = pq || '';
  });
}

let suppressClick = false;
scroller.onclick = e => {
  if (suppressClick) return;                 // vừa kéo ngang, không phải chọn bàn
  const b = e.target.closest('.tbl'); if (!b) return;
  table = +b.dataset.t;
  if (!scopeAll) $('btnScope').textContent = 'Bàn ' + table;
  b.scrollIntoView({inline:'nearest', block:'nearest', behavior:'smooth'});
  renderAll();
};

/* ---------- cuộn dải bàn: mũi tên + con lăn chuột + bàn phím ---------- */
function updateNav(){
  const max = scroller.scrollWidth - scroller.clientWidth;
  wrap.classList.toggle('scrollable', max > 2);
  wrap.classList.toggle('can-prev', scroller.scrollLeft > 2);
  wrap.classList.toggle('can-next', scroller.scrollLeft < max - 2);
  $('tPrev').disabled = scroller.scrollLeft <= 2;
  $('tNext').disabled = scroller.scrollLeft >= max - 2;
}
const nudge = dir => scroller.scrollBy({ left: dir * Math.max(160, scroller.clientWidth * 0.7), behavior:'smooth' });
$('tPrev').onclick = () => nudge(-1);
$('tNext').onclick = () => nudge(1);
scroller.addEventListener('scroll', updateNav, { passive:true });
addEventListener('resize', updateNav);
if (window.ResizeObserver) new ResizeObserver(updateNav).observe(scroller);

// con lăn dọc của chuột rời -> cuộn ngang (nhả lại cho trang khi đã chạm biên)
scroller.addEventListener('wheel', e => {
  const d = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
  if (!d) return;
  const max = scroller.scrollWidth - scroller.clientWidth;
  if (max <= 0) return;
  const next = scroller.scrollLeft + d;
  if (next < 0 || next > max) return;
  e.preventDefault();
  scroller.scrollLeft = next;
}, { passive:false });

// kéo ngang bằng chuột (màn hình cảm ứng đã có sẵn, chuột thì chưa)
let drag = null;
scroller.addEventListener('pointerdown', e => {
  if (e.pointerType === 'touch') return;
  drag = { x:e.clientX, left:scroller.scrollLeft, moved:false };
});
scroller.addEventListener('pointermove', e => {
  if (!drag) return;
  const dx = e.clientX - drag.x;
  if (Math.abs(dx) > 3){ drag.moved = true; scroller.style.scrollBehavior = 'auto'; }
  if (drag.moved) scroller.scrollLeft = drag.left - dx;
});
addEventListener('pointerup', () => {
  if (drag && drag.moved){                       // vừa kéo -> bỏ qua cú click kế tiếp
    suppressClick = true;
    setTimeout(() => suppressClick = false, 0);
  }
  scroller.style.scrollBehavior = '';
  drag = null;
}, true);

buildTables();

/* ---------- menu load ---------- */
fetch(API_URL).then(r=>r.json()).then(j=>{
  menu = Array.isArray(j) ? j : [];
  $('pillMenu').innerHTML = 'Thực đơn <b>'+menu.length+'</b>';
  renderMenu(); updatePreview();
}).catch(()=>{
  $('pillMenu').innerHTML = '<span style="color:var(--late)">⚠ Lỗi tải thực đơn</span>';
  toast('Không tải được thực đơn — kiểm tra mạng', 'err');
});
const findItem = n => menu.find(d => parseInt(d['STT'],10) === parseInt(n,10));
const nameOf   = d => d['Tên Món'] || ('Món #' + d['STT']);

/* ---------- đơn giá từ sheet Menu ----------
   Tên cột có thể là "Đơn giá", "Đơn Giá", "Giá", "Price"… nên dò theo dạng
   đã bỏ dấu thay vì gán cứng một chuỗi. */
const slug = s => String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'')
                 .replace(/đ/gi,'d').toLowerCase().replace(/[^a-z0-9]/g,'');
const PRICE_SLUGS = new Set(['dongia','gia','price','dongiavnd','dongiaban','giaban','donggia']);
function parsePrice(v){
  if (v === null || v === undefined || v === '') return null;
  if (typeof v === 'number') return isFinite(v) ? v : null;
  let s = String(v).trim().replace(/[^\d.,-]/g,'');
  if (!s) return null;
  const dec = Math.max(s.lastIndexOf('.'), s.lastIndexOf(','));
  if (dec > -1){
    const tail = s.length - dec - 1;
    if (tail === 3 || tail === 0) s = s.replace(/[.,]/g,'');            // dấu phân nhóm
    else s = s.slice(0,dec).replace(/[.,]/g,'') + '.' + s.slice(dec+1); // dấu thập phân
  }
  const n = Number(s);
  return isFinite(n) ? n : null;
}
function priceOf(row){
  for (const k of Object.keys(row||{})){
    if (PRICE_SLUGS.has(slug(k))){
      const p = parsePrice(row[k]);
      if (p !== null) return p;
    }
  }
  return null;
}
const money = n => new Intl.NumberFormat('vi-VN').format(Math.round(n)) + '₫';

/* ---------- entry: mode switch ---------- */
$('segMode').onclick = e => {
  const b = e.target.closest('button[data-m]'); if (!b) return;
  mode = b.dataset.m;
  [...e.currentTarget.children].forEach(x=>x.classList.toggle('active',x===b));
  $('modePad').style.display  = mode==='pad'  ? 'flex' : 'none';
  $('modeMenu').style.display = mode==='menu' ? 'flex' : 'none';
  if (mode==='menu') setTimeout(()=>$('q').focus(),50);
};

/* ---------- entry: quantity ---------- */
function setQty(v){ qty = Math.max(1,Math.min(99,v)); $('qty').textContent = qty; $('qty2').textContent = qty; }
$('qMinus').onclick = $('qMinus2').onclick = () => setQty(qty-1);
$('qPlus').onclick  = $('qPlus2').onclick  = () => setQty(qty+1);

/* ---------- entry: numpad ---------- */
$('numpad').onclick = e => {
  const b = e.target.closest('.key'); if (!b) return;
  handleKey(b.dataset.k);
};
function handleKey(k){
  if (k === 'del') input = input.slice(0,-1);
  else if (k === 'clr') input = '';
  else if (k === 'add') return addFromPad();
  else if (input.length < 3) input += k;
  $('display').textContent = input || '—';
  $('display').classList.toggle('blank', !input);
  updatePreview();
}
function updatePreview(){
  const el = $('preview');
  if (!input){ el.className = ''; el.textContent = menu.length ? 'Nhập mã món…' : 'Đang tải thực đơn…'; return; }
  const it = findItem(input);
  if (it){ el.className='match'; el.textContent = '✔ ' + nameOf(it); }
  else   { el.className='nomatch'; el.textContent = '✕ Không có món mã ' + input; }
}
function addFromPad(){
  if (!input) return toast('Chưa nhập mã món','err');
  const it = findItem(input);
  if (!it) return toast('Không tìm thấy món mã ' + input,'err');
  addToCart(it, qty);
  input=''; $('display').textContent='—'; $('display').classList.add('blank');
  setQty(1); updatePreview();
}
document.addEventListener('keydown', e => {
  if (/^(INPUT|TEXTAREA)$/.test(e.target.tagName)) return;   // đừng cướp phím khi đang gõ tìm kiếm
  if (document.querySelector('.overlay.open')) return;
  if (e.key >= '0' && e.key <= '9') handleKey(e.key);
  else if (e.key === 'Backspace'){ e.preventDefault(); handleKey('del'); }
  else if (e.key === 'Enter') addFromPad();
});

/* ---------- entry: menu grid ---------- */
$('q').oninput = renderMenu;
function renderMenu(){
  const q = ($('q').value||'').trim().toLowerCase();
  let list = menu;
  if (q) list = menu.filter(d => nameOf(d).toLowerCase().includes(q) || String(d['STT']).includes(q));
  list = list.slice(0,120);
  $('menuGrid').innerHTML = list.length ? list.map(d => {
    let nm = esc(nameOf(d));
    if (q) nm = nm.replace(new RegExp('('+rxEsc(esc(q))+')','gi'),'<mark>$1</mark>');
    return `<button class="mi" data-stt="${esc(d['STT'])}">
      <span class="code">${esc(d['STT'])}</span><span class="nm">${nm}</span>
    </button>`;
  }).join('')
  : `<div class="empty"><div class="ic">🔍</div><h4>Không tìm thấy món</h4><p>Thử từ khóa khác.</p></div>`;
}
$('menuGrid').onclick = e => {
  const b = e.target.closest('.mi'); if (!b) return;
  const it = findItem(b.dataset.stt); if (!it) return;
  addToCart(it, qty); setQty(1);
};

/* ---------- cart ---------- */
function addToCart(it, n){
  const existing = cart.find(o => String(o.stt)===String(it['STT']) && o.table===table);
  if (existing){ existing.qty += n; existing.time = nowHM(); }
  else cart.push({ id:nextId++, stt:it['STT'], name:nameOf(it), qty:n, table,
                   price:priceOf(it), time:nowHM() });
  cartTab = 'all';
  toast('+' + n + ' ' + nameOf(it) + ' · bàn ' + table, 'ok');
  renderAll();
}
$('cartTabs').onclick = e => {
  const b = e.target.closest('.tab'); if (!b) return;
  cartTab = b.dataset.t === 'all' ? 'all' : +b.dataset.t;
  renderCart();
};
$('cartBody').onclick = e => {
  const b = e.target.closest('[data-a]'); if (!b) return;
  const id = +b.dataset.id, o = cart.find(x=>x.id===id); if (!o) return;
  if (b.dataset.a === 'inc') o.qty++;
  if (b.dataset.a === 'dec'){ o.qty--; if (o.qty < 1) cart = cart.filter(x=>x.id!==id); }
  if (b.dataset.a === 'del') cart = cart.filter(x=>x.id!==id);
  if (b.dataset.a === 'tbl') return openTableModal(o);
  renderAll();
};
$('btnClear').onclick = () => {
  if (!cart.length) return;
  if (confirm('Xóa toàn bộ ' + cart.length + ' món trong giỏ?')){ cart = []; renderAll(); }
};

function renderCart(){
  const tables = [...new Set(cart.map(o=>o.table))].sort((a,b)=>a-b);
  if (cartTab !== 'all' && !tables.includes(cartTab)) cartTab = 'all';

  $('cartTabs').innerHTML = tables.length
    ? `<button class="tab ${cartTab==='all'?'active':''}" data-t="all">Tất cả <span class="c">${cart.length}</span></button>` +
      tables.map(t=>`<button class="tab ${cartTab===t?'active':''}" data-t="${t}">Bàn ${t} <span class="c">${cart.filter(o=>o.table===t).length}</span></button>`).join('')
    : '';
  $('cartTabs').style.display = tables.length ? 'flex' : 'none';

  const list = cartTab==='all' ? cart : cart.filter(o=>o.table===cartTab);
  const totalQty = cart.reduce((s,o)=>s+o.qty,0);
  const totalVal = cart.reduce((s,o)=>s+(o.price||0)*o.qty,0);
  const noPrice  = cart.some(o=>o.price==null);
  $('cartNote').textContent = cart.length
    ? cart.length+' món · '+totalQty+' ly' + (totalVal ? ' · '+money(totalVal)+(noPrice?' (thiếu giá)':'') : '')
    : 'chưa gửi';

  $('cartBody').innerHTML = list.length ? list.map(o=>`
    <div class="row">
      <div class="qc">
        <button data-a="dec" data-id="${o.id}">−</button>
        <span class="qv">${o.qty}</span>
        <button data-a="inc" data-id="${o.id}">+</button>
      </div>
      <div class="info">
        <div class="nm">${esc(o.name)}</div>
        <div class="mt">#${esc(o.stt)} · Bàn ${o.table} · ${
          o.price != null ? money(o.price * o.qty) : '<span style="color:var(--warn)">chưa có giá</span>'
        }</div>
      </div>
      <div class="acts">
        <button class="ico" data-a="tbl" data-id="${o.id}" title="Đổi bàn">🔄</button>
        <button class="ico danger" data-a="del" data-id="${o.id}" title="Xóa">✕</button>
      </div>
    </div>`).join('')
    : `<div class="empty"><div class="ic">🧾</div><h4>Giỏ hàng trống</h4>
       <p>Nhập mã món ở bên trái hoặc chọn từ thực đơn.<br>Món sẽ ghi vào <b>bàn ${table}</b>.</p></div>`;

  const btn = $('btnSend');
  btn.disabled = !cart.length;
  btn.innerHTML = cart.length
    ? `📤 Gửi đơn xuống quầy <span class="n">${totalQty} ly</span>`
    : '📤 Gửi đơn xuống quầy';
}

$('btnSend').onclick = async () => {
  if (!cart.length) return;
  const btn = $('btnSend'); btn.disabled = true; btn.innerHTML = '⏳ Đang gửi…';
  const batch = cart.slice();
  try{
    await Promise.all(batch.map(o => push(ordersRef, {
      item: o.name, quantity: o.qty, table: o.table,
      stt: o.stt ?? null,
      price: o.price ?? null,          // chốt đơn giá tại thời điểm bán
      time: nowHM(), status: 'Chờ pha', sentAt: serverTimestamp()
    })));
    cart = []; cartTab = 'all'; renderAll();
    toast('Đã gửi ' + batch.length + ' món xuống quầy','ok');
  }catch(err){
    console.error(err); renderAll();
    toast('Gửi đơn thất bại — kiểm tra kết nối','err');
  }
};

/* ---------- change table modal ---------- */
let tblTarget = null;
function openTableModal(o){
  tblTarget = o;
  $('tblRecap').innerHTML = esc(o.name) + ' — đang ở <b>bàn ' + o.table + '</b>';
  $('tblGrid').innerHTML = Array.from({length:TABLES},(_,i)=>{
    const n=i+1; return `<button class="${n===o.table?'cur':''}" data-t="${n}">${n}</button>`;
  }).join('');
  $('ovTable').classList.add('open');
}
$('tblGrid').onclick = e => {
  const b = e.target.closest('button[data-t]'); if (!b || !tblTarget) return;
  const n = +b.dataset.t;
  const dup = cart.find(o => o!==tblTarget && String(o.stt)===String(tblTarget.stt) && o.table===n);
  if (dup){ dup.qty += tblTarget.qty; cart = cart.filter(o=>o!==tblTarget); }
  else tblTarget.table = n;
  $('ovTable').classList.remove('open'); tblTarget = null;
  renderAll();
};

/* ═══════════ PENDING (đã gửi, chưa pha xong) ═══════════ */
$('btnScope').onclick = () => {
  scopeAll = !scopeAll;
  $('btnScope').textContent = scopeAll ? 'Tất cả bàn' : 'Bàn ' + table;
  renderPending();
};

function renderPending(){
  const rows = (scopeAll ? pending : pending.filter(o => o.table == table))
                 .sort((a,b) => a.at - b.at);
  const q = rows.reduce((s,o)=>s+(Number(o.quantity)||0),0);
  $('pendNote').textContent = rows.length ? rows.length + ' món · ' + q + ' ly' : '';
  $('pillPend').innerHTML = 'Đang chờ pha <b>' + pending.reduce((s,o)=>s+(Number(o.quantity)||0),0) + '</b>';

  if (!rows.length){
    $('pendBody').innerHTML = `<div class="empty"><div class="ic">✅</div>
      <h4>${scopeAll ? 'Quầy đã pha xong tất cả' : 'Bàn ' + table + ' không còn món chờ'}</h4>
      <p>Món đã gửi sẽ hiện ở đây cho đến khi quầy bấm “Hoàn thành”.</p></div>`;
    return;
  }

  $('pendBody').innerHTML = rows.map(o => {
    const el = Date.now() - o.at;
    const st = o.cancel && o.cancel.state;
    let cls = 'pend ' + ageCls(el);
    let banner = '', acts = '';

    if (st === 'requested'){
      cls = 'pend req';
      banner = `<div class="note w"><b>⏳ Đã gửi yêu cầu hủy</b>${esc(o.cancel.reason||'')}${o.cancel.note?' — '+esc(o.cancel.note):''}<br>Đang chờ quầy xác nhận.</div>`;
      acts   = `<button class="btn" data-a="undo" data-k="${o.key}">↩ Thu hồi yêu cầu</button>`;
    } else if (st === 'rejected'){
      cls = 'pend rej';
      banner = `<div class="note r"><b>✕ Quầy từ chối hủy</b>${esc(o.cancel.barNote || 'Món đã/đang được pha.')}</div>`;
      acts   = `<button class="btn" data-a="ack" data-k="${o.key}">Đã hiểu</button>
                <button class="btn danger" data-a="req" data-k="${o.key}">Yêu cầu lại</button>`;
    } else {
      acts   = `<button class="btn danger" data-a="req" data-k="${o.key}">✕ Yêu cầu hủy</button>`;
    }

    return `<article class="${cls}" data-key="${o.key}" data-at="${o.at}">
      <div class="pend-top">
        <div class="q">${Number(o.quantity)||1}</div>
        <div style="flex:1;min-width:0">
          <div class="nm">${esc(o.item)}</div>
          <div class="mt">Bàn ${esc(o.table ?? '—')} · gửi lúc ${esc(o.time||'')}</div>
        </div>
        <div class="el">${fmtEl(el)}</div>
      </div>
      ${banner}
      <div class="pend-acts">${acts}</div>
    </article>`;
  }).join('');
}

$('pendBody').onclick = e => {
  const b = e.target.closest('[data-a]'); if (!b) return;
  const key = b.dataset.k;
  if (b.dataset.a === 'req')  return openCancelModal(key);
  if (b.dataset.a === 'undo') return writeCancel(key, null, '↩ Đã thu hồi yêu cầu hủy');
  if (b.dataset.a === 'ack')  return writeCancel(key, null, '');
};

/* cập nhật đồng hồ trôi mỗi giây, không vẽ lại cả danh sách */
setInterval(() => {
  document.querySelectorAll('.pend[data-at]').forEach(c => {
    const el = Date.now() - Number(c.dataset.at);
    const lbl = c.querySelector('.el'); if (lbl) lbl.textContent = fmtEl(el);
    if (!c.classList.contains('req') && !c.classList.contains('rej')){
      c.classList.remove('age-warn','age-late');
      const k = ageCls(el); if (k) c.classList.add(k);
    }
  });
}, 1000);

/* ---------- cancel modal ---------- */
function openCancelModal(key){
  const o = pending.find(x=>x.key===key); if (!o) return;
  cancelKey = key; cancelReason = CANCEL_REASONS[0];
  $('cancelRecap').innerHTML =
    `<div class="q">${Number(o.quantity)||1}</div>
     <div><div class="nm">${esc(o.item)}</div>
     <div class="mt">Bàn ${esc(o.table ?? '—')} · gửi lúc ${esc(o.time||'')} · đã chờ ${fmtEl(Date.now()-o.at)}</div></div>`;
  $('reasons').innerHTML = CANCEL_REASONS.map((r,i)=>
    `<button class="reason ${i===0?'sel':''}" data-r="${esc(r)}"><span class="rk"></span>${esc(r)}</button>`).join('');
  $('cancelNote').value = '';
  $('ovCancel').classList.add('open');
}
$('reasons').onclick = e => {
  const b = e.target.closest('.reason'); if (!b) return;
  cancelReason = b.dataset.r;
  [...e.currentTarget.children].forEach(x=>x.classList.toggle('sel',x===b));
};
$('btnSendCancel').onclick = () => {
  if (!cancelKey) return;
  writeCancel(cancelKey, {
    state : 'requested',
    reason: cancelReason,
    note  : $('cancelNote').value.trim() || null,
    at    : serverTimestamp()
  }, '✓ Đã gửi yêu cầu hủy xuống quầy');
  $('ovCancel').classList.remove('open');
  cancelKey = null;
};

function writeCancel(key, payload, okMsg){
  update(ref(db,'orders/'+key), { cancel: payload })
    .then(()=>{ if (okMsg) toast(okMsg, payload ? 'err' : 'ok'); })
    .catch(err=>{ console.error(err); toast('Không gửi được — kiểm tra quyền ghi (.write)','err'); });
}

/* ---------- firebase live ---------- */
onValue(ref(db,'.info/connected'), s=>{
  const on = s.val() === true;
  $('conn').className = 'conn ' + (on?'online':'offline');
  $('connTxt').textContent = on ? 'Trực tuyến' : 'Mất kết nối';
});

onValue(ordersRef, snap => {
  const prev = new Map(pending.map(o=>[o.key, o.cancel && o.cancel.state]));
  pending = [];
  snap.forEach(c => {
    const d = c.val() || {};
    pending.push({ key:c.key, item:d.item, quantity:d.quantity, table:d.table,
                   time:d.time, at:parseClock(d.time), cancel:d.cancel || null });
  });
  // báo cho thu ngân khi quầy vừa từ chối một yêu cầu hủy
  pending.forEach(o=>{
    if (o.cancel && o.cancel.state === 'rejected' && prev.get(o.key) === 'requested')
      toast('Quầy từ chối hủy: ' + o.item, 'err');
  });
  renderTables(); renderPending();
}, err => {
  console.error(err);
  toast('Không đọc được danh sách chờ — kiểm tra quyền đọc (.read)','err');
});

/* ---------- boot ---------- */
function renderAll(){ renderTables(); renderCart(); renderPending(); }
renderAll();
</script>

<script type="module" src="./auth-guard.js"></script>
</body>
</html>
